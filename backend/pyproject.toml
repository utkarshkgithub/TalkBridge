[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "talkbridge-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.11.20",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.29.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "semgrep>=1.79.0",
    "tree-sitter>=0.27.0",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "hatchling>=1.33.0",
    "httpx>=0.29.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
eval = [
    "pyarrow>=26.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["certifi", "tree_sitter.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
